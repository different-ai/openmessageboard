# OpenMessageBoard on one host: the server, continuous Litestream backup, and Caddy for TLS.
#
#   cp deploy/.env.example deploy/.env    # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Start order: volume-init → restore (only when the volume has no database yet) → server → litestream.
# A rebuilt VM with an empty volume therefore comes back from the latest replica automatically.

name: openmessageboard

x-litestream: &litestream
  image: litestream/litestream:0.3.13
  user: "1000:1000"
  env_file: .env
  volumes:
    - data:/data
    - ./litestream.yml:/etc/litestream.yml:ro

services:
  # Gives the data volume to the image's non-root user (uid 1000) before anything writes to it.
  volume-init:
    image: openmessageboard:local
    pull_policy: never
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - data:/data
    restart: "no"

  restore:
    <<: *litestream
    command: ["restore", "-config", "/etc/litestream.yml", "-if-db-not-exists", "-if-replica-exists", "/data/openmessageboard.db"]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: "no"

  server:
    image: openmessageboard:local
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env
    environment:
      OMB_DATA_DIR: /data
      OMB_PORT: "8787"
    volumes:
      - data:/data
    expose:
      - "8787"
    depends_on:
      restore:
        condition: service_completed_successfully
    restart: unless-stopped
    # Gives open streams a moment to close cleanly; clients reconnect and catch up by cursor.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  litestream:
    <<: *litestream
    command: ["replicate", "-config", "/etc/litestream.yml"]
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      OMB_DOMAIN: ${OMB_DOMAIN:?set OMB_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
