name: ci

# Every pull request targets main. Releases are tags on main (release.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # setup-node v5 caches automatically when package.json names a package manager, which needs pnpm on PATH
          # first. The pnpm store is cached explicitly below instead.
          package-manager-cache: false

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build protocol and SDK
        run: |
          pnpm --filter @openmessageboard/protocol run build
          pnpm --filter @openmessageboard/core run build
          pnpm --filter @openmessageboard/sdk run build

      - name: Typecheck
        run: |
          pnpm -r run typecheck
          implementations/node/node_modules/.bin/tsc -p loadtest/tsconfig.json

      - name: Test
        run: pnpm -r run test

      - name: Build web and server
        run: |
          pnpm --filter @openmessageboard/web run build
          pnpm --filter @openmessageboard/server-node run build

      # CI has no external identity provider, so the server signs people in by email code (test mode mints tokens).
      - name: Start server (test mode)
        env:
          OMB_TEST_MODE: "1"
          OMB_AUTH_PROVIDERS: email
          OMB_LIMIT_POSTS_PER_MONTH: "200"
          OMB_LIMIT_MEMBERS_PER_BOARD: "4"
          # Generous burst limits keep the conformance run fast; quota cases read limits from discovery.
          OMB_RATE_WRITES_PER_MINUTE_PRINCIPAL: "1000"
          OMB_RATE_WRITES_PER_MINUTE_BOARD: "3000"
          OMB_RATE_READS_PER_MINUTE_PRINCIPAL: "5000"
          OMB_RATE_STREAMS_PER_MINUTE_PRINCIPAL: "500"
          OMB_RATE_REDEMPTIONS_PER_HOUR_PRINCIPAL: "500"
          OMB_DATA_DIR: /tmp/omb-ci-data
        run: |
          mkdir -p "$OMB_DATA_DIR"
          nohup node implementations/node/dist/cli.js serve > /tmp/omb-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8787/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8787/healthz

      - name: Mint test identities
        env:
          OMB_TEST_MODE: "1"
          OMB_AUTH_PROVIDERS: email
          OMB_DATA_DIR: /tmp/omb-ci-data
        run: node implementations/node/dist/cli.js admin test-identities --out conformance/identities.json

      - name: Conformance
        # pnpm hands every argument after the script name to the script (a "--" would be passed on too).
        run: pnpm --filter @openmessageboard/conformance start --url http://localhost:8787 --identities "$GITHUB_WORKSPACE/conformance/identities.json"

      - name: Server log
        if: always()
        run: cat /tmp/omb-server.log 2>/dev/null || true

  cloudflare:
    name: Cloudflare conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build protocol, core and web
        run: |
          pnpm --filter @openmessageboard/protocol run build
          pnpm --filter @openmessageboard/core run build
          pnpm --filter @openmessageboard/web run build

      - name: Unit tests
        run: pnpm --filter @openmessageboard/server-cloudflare run test

      # The Worker and its Durable Object run locally in workerd (no Cloudflare account). Test mode lets the
      # conformance runner receive webhooks on 127.0.0.1 and mint identities with a one-off admin token.
      - name: Start the Worker (workerd, test mode)
        working-directory: implementations/cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          token=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "OMB_TEST_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          nohup node_modules/.bin/wrangler dev --port 8788 --ip 127.0.0.1 --show-interactive-dev-session=false \
            --persist-to /tmp/omb-cf-state \
            --var OMB_PUBLIC_URL:http://localhost:8788 --var "OMB_SECRET:$(openssl rand -hex 32)" --var OMB_TEST_MODE:1 \
            --var OMB_AUTH_PROVIDERS:email --var "OMB_TEST_ADMIN_TOKEN:$token" \
            --var OMB_LIMIT_POSTS_PER_MONTH:200 --var OMB_LIMIT_MEMBERS_PER_BOARD:4 \
            --var OMB_RATE_WRITES_PER_MINUTE_PRINCIPAL:1000 --var OMB_RATE_WRITES_PER_MINUTE_BOARD:3000 \
            --var OMB_RATE_READS_PER_MINUTE_PRINCIPAL:5000 --var OMB_RATE_STREAMS_PER_MINUTE_PRINCIPAL:500 \
            --var OMB_RATE_REDEMPTIONS_PER_HOUR_PRINCIPAL:500 > /tmp/omb-cf.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8788/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8788/healthz

      - name: Mint test identities
        run: |
          curl -fsS -X POST -H "authorization: Bearer $OMB_TEST_ADMIN_TOKEN" http://localhost:8788/x/test/identities -o conformance/identities-cloudflare.json

      - name: Conformance
        run: pnpm --filter @openmessageboard/conformance start --url http://localhost:8788 --identities "$GITHUB_WORKSPACE/conformance/identities-cloudflare.json"

      - name: Worker log
        if: always()
        run: cat /tmp/omb-cf.log 2>/dev/null || true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: openmessageboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          test "$(docker inspect --format '{{.Config.User}}' openmessageboard:ci)" = node
          docker run -d --name omb -p 8787:8787 -e OMB_AUTH_PROVIDERS=email -e OMB_METRICS_TOKEN=ci-metrics openmessageboard:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8787/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8787/healthz
          curl -fsS http://localhost:8787/.well-known/openmessageboard > /dev/null
          curl -fsS -H "x-omb-metrics-token: ci-metrics" http://localhost:8787/metrics
          docker exec omb omb --help > /dev/null
          docker exec omb litestream version

      - name: Container log
        if: always()
        run: docker logs omb 2>/dev/null || true

  dco:
    name: dco sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c is missing a Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  # Approves a pull request from this repository once every job above passed,
  # so pull requests into main meet the ruleset's one-approval rule without
  # waiting for a person. Forks are never approved. The approval comes
  # from github-actions, which never pushes, so it counts as an approval after
  # the last push; a new push dismisses it and the next green run approves
  # again. It approves what CI checked, not what a reviewer read.
  approve:
    name: approve when CI passes
    needs: [test, cloudflare, docker, dco]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: approve the pull request at the head CI checked
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)" != "$HEAD" ]; then
            echo "the pull request moved on since this run; the next run decides"
            exit 0
          fi
          gh pr review "$PR" --repo "$REPO" --approve --body "CI passed at $HEAD."
