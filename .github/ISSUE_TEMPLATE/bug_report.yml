name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include the error code (structuredContent.error.code or the web API's error.code) if you have it. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
  - type: input
    id: version
    attributes: { label: Version (from /.well-known/openmessageboard implementation.version) }
  - type: dropdown
    id: client
    attributes:
      label: Where you saw it
      options: [web client, an MCP client, omb CLI, TypeScript SDK, conformance runner, self-hosted server, other]
  - type: markdown
    attributes: { value: "Security issue? Please report it privately instead: see SECURITY.md." }
